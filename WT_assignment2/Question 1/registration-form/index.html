<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Student Registration</h1>
    <form id="regForm" novalidate>

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">
      <span class="error" id="nameError"></span>

      <label for="roll">Roll Number</label>
      <input type="text" id="roll" placeholder="e.g. 21CS101">
      <span class="error" id="rollError"></span>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
      <span class="error" id="emailError"></span>

      <label for="course">Course</label>
      <select id="course">
        <option value="">-- Select Course --</option>
        <option>B.E. Computer Science</option>
        <option>B.E. Electronics</option>
        <option>B.E. Mechanical</option>
        <option>B.Sc. Mathematics</option>
      </select>
      <span class="error" id="courseError"></span>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 8 chars, upper, lower, number, symbol">
      <span class="error" id="passwordError"></span>

      <label for="file">Upload Document (PDF/JPG/PNG, max 2MB)</label>
      <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png">
      <span class="error" id="fileError"></span>

      <button type="submit">Register</button>
      <p class="success" id="successMsg"></p>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
